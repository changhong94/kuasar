[workspace]
members = [
    "vmm/task",
    "vmm/sandbox",
    "vmm/common",
    "vmm/client",
    "runc",
    "quark",
    "wasm",
    "shim",
    "tools/kuasar-ctl",
]
exclude = [
    "tests/e2e"
]
resolver = "2"

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
ttrpc = { path = "../ttrpc-rust" }

# Same-host fork research: fix cgroup-v1 OOM eventfd ownership in the guest
# agent's shim dependency. Keep related crates on the same local source.
[patch."https://github.com/kuasar-io/rust-extensions.git"]
containerd-shim = { path = "../rust-extensions/crates/shim" }
containerd-shim-protos = { path = "../rust-extensions/crates/shim-protos" }
containerd-sandbox = { path = "../rust-extensions/crates/sandbox" }
runc = { path = "../rust-extensions/crates/runc" }

[patch."https://github.com/kuasar-io/ttrpc-rust.git"]
ttrpc = { path = "../ttrpc-rust" }
