[sandbox]
log_level="info"
enable_tracing=false
[sandbox.snapshot]
enable_environment_restore=false
enable_warmfork_restore=false
fallback_to_fresh_boot=false
default_memory_restore_mode="ondemand"
[hypervisor]
path="/srv/forklab/bin/cloud-hypervisor"
vcpus=1
memory_in_mb=2048
kernel_path="/srv/forklab/assets/vmlinuz"
image_path="/srv/forklab/data/seed.raw"
initrd_path="/srv/forklab/assets/boot.cpio"
kernel_params="console=ttyS0 rdinit=/init task.log_level=info"
hugepages=false
entropy_source="/dev/urandom"
debug=false
container_storage_backend="virtio-blk"
live_fork=true
live_fork_agent=true
live_fork_writable_disk=true
[hypervisor.task]
debug=false
enable_tracing=false
[checkpoint]
mode="local"
